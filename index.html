<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Expense Tracker</title>
</head>
<body>
        <div class="container shadow-lg p-3 mb-5 bg-body-tertiary rounded" style="display: flex; justify-self: center; flex-direction: column; margin: 20px;">
            <h3 style="text-align: center;">Expense Tracker</h3>
            <h5 style="text-align: center;">Your Balance</h5>
            <div class="balance-div" style="text-align: center; color: rgb(113, 44, 249); font-weight: 500;">0</div>
            <div class="row">
                <div class="col-sm-6 mb-3 mb-sm-0">
                    <div class="card" style="padding: 25px; background-color: #e7e5dd;">
                    <h5 class="card-title" style="text-align: center;">Income</h5>
                    <p class="card-text income-div" style="text-align: center; font-weight: 500;">0</p>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="card" style="padding: 25px; background-color: #edccbf;">
                    <h5 class="card-title" style="text-align: center;">Expenses</h5>
                    <p class="card-text expenses-div" style="text-align: center; font-weight: 500;">0</p>
                    </div>
                </div>
            </div>
            <br>
            <h5>Add Transaction</h5>
            <form onsubmit="submitTrans()">
                <label for="description"><span style="color: rgb(37, 36, 36); font-weight: 400;">Description</span></label> <br>
                <input type="text" name="description" id="description" placeholder="Enter description" class="description form-control">
                <label for="description"><span style="color: rgb(37, 36, 36); font-weight: 400;">Amount(negative -expense, positive -income)</span></label> <br>
                <input type="number" name="description" id="description" placeholder="Enter Amount" class="amount form-control"><br>
                <button style="background-color: rgb(113, 44, 249); color: aliceblue;" class="btn" onclick="addTransac()">Add Transaction</button>
                <button style="background-color: #edccbf;" class="btn" onclick="clear()"><i class="fa-solid fa-xmark"></i>clear all expenses</button>
            </form><br>
            <h5 style="color : rgb(113, 44, 249); font-weight: 500;">Transaction History</h5>
            <table class="table">
                <thead class="table-light">
                      <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Action</th>
                      </tr>
                </thead>
                <tbody>
                      
                </tbody>
            </table>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
